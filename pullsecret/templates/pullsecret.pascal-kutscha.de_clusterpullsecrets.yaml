---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: clusterpullsecrets.pullsecret.pascal-kutscha.de
spec:
  group: pullsecret.pascal-kutscha.de
  names:
    kind: ClusterPullSecret
    listKind: ClusterPullSecretList
    plural: clusterpullsecrets
    shortNames:
    - cps
    singular: clusterpullsecret
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.synced
      name: Synced
      type: boolean
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last-Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ClusterPullSecret is the Schema for the clusterpullsecrets API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterPullSecretSpec defines the desired state of ClusterPullSecret.
            properties:
              credentials:
                description: |-
                  Credentials defines secure access to the registry or container registries.
                  It may reference an existing Secret (secretRef) or contain encrypted credential data.
                properties:
                  dockerConfigJson:
                    description: |-
                      DockerConfigJson holds inline .dockerconfigjson content, either as raw JSON or
                      base64-encoded JSON (the operator accepts both). This value is NOT encrypted and is
                      readable by anyone who can read the ClusterPullSecret; for sensitive credentials use
                      secretRef or registryCredentials and protect the referenced Secret at rest.
                    type: string
                  encryptedData:
                    description: |-
                      EncryptedData is a deprecated alias for dockerConfigJson and is treated identically
                      (it is NOT decrypted). Use dockerConfigJson instead.

                      Deprecated: use dockerConfigJson.
                    type: string
                  registryCredentials:
                    description: |-
                      RegistryCredentials references a Secret whose keys hold individual credential fields
                      (server, username, password, email). The operator assembles the .dockerconfigjson
                      automatically, so no credential data needs to be embedded in the ClusterPullSecret spec.
                    properties:
                      emailKey:
                        description: |-
                          EmailKey is the key in the Secret whose value is the registry email address.
                          Defaults to "email" when not set. The email field is optional in the resulting config.
                        type: string
                      namespace:
                        description: Namespace is the namespace of the Secret.
                        minLength: 1
                        type: string
                      passwordKey:
                        description: |-
                          PasswordKey is the key in the Secret whose value is the registry password.
                          Defaults to "password" when not set.
                        type: string
                      secretName:
                        description: SecretName is the name of the Secret containing
                          the credential fields.
                        minLength: 1
                        type: string
                      serverKey:
                        description: |-
                          ServerKey is the key in the Secret whose value is the registry server address (e.g. "ghcr.io").
                          Defaults to "server" when not set.
                        type: string
                      usernameKey:
                        description: |-
                          UsernameKey is the key in the Secret whose value is the registry username.
                          Defaults to "username" when not set.
                        type: string
                    required:
                    - namespace
                    - secretName
                    type: object
                  secretRef:
                    description: |-
                      SecretRef points to a Secret whose referenced key already contains valid
                      .dockerconfigjson content. The value is copied verbatim into the generated Secret.
                    properties:
                      key:
                        description: |-
                          Key is the key within the Secret data whose value is valid .dockerconfigjson
                          content (commonly ".dockerconfigjson"). The value is copied verbatim, so it must
                          be a serialized ~/.docker/config.json, not a bare token or password.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of secretRef, dockerConfigJson, registryCredentials
                    or encryptedData must be set
                  rule: '[has(self.secretRef), has(self.dockerConfigJson), has(self.registryCredentials),
                    has(self.encryptedData)].filter(x, x).size() == 1'
            required:
            - credentials
            type: object
          status:
            description: ClusterPullSecretStatus defines the observed state of ClusterPullSecret.
            properties:
              lastSyncTime:
                description: LastSyncTime is the last time the secret was successfully
                  reconciled.
                format: date-time
                type: string
              lastValidationTime:
                description: |-
                  LastValidationTime is the last time the credentials were validated, regardless
                  of outcome. Useful to detect a stalled controller.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is a coarse, human-readable summary of the sync
                  state (Synced/OutOfSync).
                type: string
              reason:
                description: Reason provides a human-readable explanation when the
                  secret is not synced.
                type: string
              registryAuth:
                description: |-
                  RegistryAuth reports the result of the active login check against each registry
                  referenced by the credentials. Populated only when registry validation is enabled.
                items:
                  description: RegistryAuthStatus reports whether a specific registry
                    accepted the credentials.
                  properties:
                    authenticated:
                      description: |-
                        Authenticated is true if the registry accepted the credentials. A false value
                        with a reason of an explicit rejection (HTTP 401/403) indicates expired or wrong
                        credentials; an "unreachable" reason means the check was inconclusive.
                      type: boolean
                    lastCheckTime:
                      description: LastCheckTime is when this registry was last checked.
                      format: date-time
                      type: string
                    reason:
                      description: Reason explains the outcome (empty on success).
                      type: string
                    registry:
                      description: Registry is the registry server the credentials
                        were tested against.
                      type: string
                  required:
                  - authenticated
                  - registry
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              synced:
                description: Synced indicates whether the pull secret is currently
                  valid and usable.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

# Default values for pullsecret-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/itdpk-de/pullsecret-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

# Soft pod anti-affinity by default so replicas spread across nodes (relevant for HA).
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: pullsecret-operator

# PodDisruptionBudget (relevant when running >1 replica with leaderElection enabled).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1   # set one of minAvailable / maxUnavailable

# Active registry-login validation. When enabled the operator periodically tries to
# authenticate against each referenced registry to detect expired/wrong credentials.
# Requires network egress from the operator to those registries.
registryValidation:
  enabled: true
  timeoutSeconds: 10
  # How often to actively re-check each registry login (throttled to avoid rate limits).
  intervalSeconds: 1800
  # Optional ConfigMap holding a CA bundle (PEM) to trust private-registry certificates.
  caBundle:
    configMapName: ""
    key: ca.crt

# Mutating webhook that injects imagePullSecrets into Pods based on the
# cluster-pull-secrets annotation. It mutates Pods (not workloads), so it is invisible
# to GitOps controllers (Argo CD / Flux) and does not cause reconciliation loops.
webhook:
  enabled: false
  port: 9443
  # Ignore = pod creation proceeds if the operator is unavailable (recommended, no outage).
  # Fail = pod creation is blocked if the webhook cannot be reached.
  failurePolicy: Ignore
  # Certificate handling:
  # - certManager.enabled=false (default): the chart generates a self-signed cert and
  #   reuses it across upgrades via lookup. NOTE: with GitOps tools that render via
  #   `helm template` (Argo CD/Flux), lookup is unavailable and the cert/caBundle would
  #   regenerate on every sync -> use cert-manager instead.
  # - certManager.enabled=true: a cert-manager Certificate + self-signed Issuer are
  #   created and the CA is injected into the webhook config (GitOps-friendly).
  certManager:
    enabled: false
  # namespaceSelector limiting which namespaces the webhook acts on. Defaults to excluding
  # control-plane namespaces (extend the values list to exclude more).
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - kube-node-lease

# Prometheus metrics endpoint (serves /metrics)
metrics:
  port: 8080
  # Create a Service so Prometheus can scrape the metrics port.
  service:
    enabled: true

# ServiceMonitor for the Prometheus Operator (requires its CRDs to be installed).
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: ""
  # Extra labels, e.g. to match your Prometheus serviceMonitorSelector.
  labels: {}

# Health/readiness probe endpoint (serves /healthz and /readyz)
health:
  port: 8081

# Leader election configuration
leaderElection:
  enabled: false
  namespace: kube-system

# Namespace where the operator is deployed
namespace: pullsecret-operator-system

# Install CRDs as part of the chart
installCRDs: true

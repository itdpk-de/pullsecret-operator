apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pullsecret-operator.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pullsecret-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pullsecret-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pullsecret-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pullsecret-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        - name: health
          containerPort: {{ .Values.health.port }}
          protocol: TCP
        env:
        - name: METRICS_BIND_ADDRESS
          value: ":{{ .Values.metrics.port }}"
        - name: HEALTH_PROBE_BIND_ADDRESS
          value: ":{{ .Values.health.port }}"
        - name: REGISTRY_VALIDATION_ENABLED
          value: {{ .Values.registryValidation.enabled | quote }}
        - name: REGISTRY_VALIDATION_TIMEOUT_SECONDS
          value: {{ .Values.registryValidation.timeoutSeconds | quote }}
        {{- if .Values.leaderElection.enabled }}
        - name: ENABLE_LEADER_ELECTION
          value: "true"
        - name: LEADER_ELECTION_NAMESPACE
          value: {{ .Values.leaderElection.namespace }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

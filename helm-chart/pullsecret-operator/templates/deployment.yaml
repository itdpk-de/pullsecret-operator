apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pullsecret-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pullsecret-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pullsecret-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pullsecret-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pullsecret-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        - name: health
          containerPort: {{ .Values.health.port }}
          protocol: TCP
        {{- if .Values.webhook.enabled }}
        - name: webhook
          containerPort: {{ .Values.webhook.port }}
          protocol: TCP
        {{- end }}
        env:
        - name: METRICS_BIND_ADDRESS
          value: ":{{ .Values.metrics.port }}"
        - name: HEALTH_PROBE_BIND_ADDRESS
          value: ":{{ .Values.health.port }}"
        - name: REGISTRY_VALIDATION_ENABLED
          value: {{ .Values.registryValidation.enabled | quote }}
        - name: REGISTRY_VALIDATION_TIMEOUT_SECONDS
          value: {{ .Values.registryValidation.timeoutSeconds | quote }}
        - name: REGISTRY_VALIDATION_INTERVAL_SECONDS
          value: {{ .Values.registryValidation.intervalSeconds | quote }}
        {{- if .Values.registryValidation.caBundle.configMapName }}
        - name: REGISTRY_CA_BUNDLE_FILE
          value: /etc/pullsecret/ca/{{ .Values.registryValidation.caBundle.key }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - name: WEBHOOK_ENABLED
          value: "true"
        - name: WEBHOOK_PORT
          value: {{ .Values.webhook.port | quote }}
        - name: WEBHOOK_CERT_DIR
          value: /tmp/k8s-webhook-server/serving-certs
        {{- end }}
        {{- if .Values.leaderElection.enabled }}
        - name: ENABLE_LEADER_ELECTION
          value: "true"
        - name: LEADER_ELECTION_NAMESPACE
          value: {{ .Values.leaderElection.namespace }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        {{- if or .Values.webhook.enabled .Values.registryValidation.caBundle.configMapName }}
        volumeMounts:
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
        {{- if .Values.registryValidation.caBundle.configMapName }}
        - name: registry-ca
          mountPath: /etc/pullsecret/ca
          readOnly: true
        {{- end }}
        {{- end }}
      {{- if or .Values.webhook.enabled .Values.registryValidation.caBundle.configMapName }}
      volumes:
      {{- if .Values.webhook.enabled }}
      - name: webhook-certs
        secret:
          secretName: {{ include "pullsecret-operator.fullname" . }}-webhook-cert
      {{- end }}
      {{- if .Values.registryValidation.caBundle.configMapName }}
      - name: registry-ca
        configMap:
          name: {{ .Values.registryValidation.caBundle.configMapName }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

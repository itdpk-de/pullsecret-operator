apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pullsecret-operator.fullname" . }}
  labels:
    {{- include "pullsecret-operator.labels" . | nindent 4 }}
rules:
  # ClusterPullSecret CRD permissions
  - apiGroups:
      - pullsecret.itdpk.de
    resources:
      - clusterpullsecrets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - pullsecret.itdpk.de
    resources:
      - clusterpullsecrets/status
    verbs:
      - get
      - update
      - patch
  # Secret permissions
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Workload permissions (kinds that can reference imagePullSecrets)
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  # Event permissions
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Lease permissions for leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

# Example: ClusterPullSecret with Encrypted Data

This example shows how to create a ClusterPullSecret with encrypted credentials stored directly in the resource.

## Create Docker Config JSON

First, create your Docker config JSON with credentials:

```bash
# Create the config JSON
cat > docker-config.json <<EOF
{
  "auths": {
    "ghcr.io": {
      "auth": "$(echo -n 'username:password' | base64)"
    }
  }
}
EOF
```

## Encrypt and Encode

For production use, you should encrypt the credentials using a tool like SOPS, KMS, or similar:

```bash
# Example with base64 encoding (NOT ENCRYPTED - for demo only)
# In production, encrypt first, then base64 encode
cat docker-config.json | base64 -w 0 > docker-config-encoded.txt
```

**Note**: The above is just base64 encoding, NOT encryption. In production, you must:
1. Encrypt the docker-config.json using your preferred encryption method (SOPS, AWS KMS, etc.)
2. Then base64 encode the encrypted content

## Create ClusterPullSecret

Apply this ClusterPullSecret resource:

```yaml
apiVersion: pullsecret.pascal-kutscha.de/v1
kind: ClusterPullSecret
metadata:
  name: my-encrypted-registry
spec:
  credentials:
    encryptedData: |
      ewogICJhdXRocyI6IHsKICAgICJnaGNyLmlvIjogewogICAgICAiYXV0aCI6ICJkWE5s
      Y201aGJXVTZjR0Z6YzNkdmNtUT0iCiAgICB9CiAgfQp9Cg==
```

Save the above to a file (e.g., `clusterpullsecret-encrypted.yaml`) and apply:

```bash
kubectl apply -f clusterpullsecret-encrypted.yaml
```

## Use in Deployment

Annotate your Deployment to automatically get the pull secret:

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-secure-app
  annotations:
    pullsecret.pascal-kutscha.de/cluster-pull-secrets: "my-encrypted-registry"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-secure-app
  template:
    metadata:
      labels:
        app: my-secure-app
    spec:
      containers:
      - name: my-secure-app
        image: ghcr.io/myorg/my-private-image:latest
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: pullsecret-my-encrypted-registry
```

## Security Best Practices

When using encrypted data:

1. **Never commit unencrypted credentials** to version control
2. **Use proper encryption** tools like:
   - [SOPS](https://github.com/mozilla/sops) with AWS KMS, GCP KMS, Azure Key Vault, or PGP
   - Sealed Secrets
   - HashiCorp Vault
3. **Encrypt first, then base64 encode** the encrypted content
4. **Rotate credentials regularly**
5. **Use RBAC** to restrict who can view/modify ClusterPullSecret resources

## Verify

Check that the secret was created:

```bash
kubectl get secrets -n <your-namespace> | grep pullsecret-my-encrypted-registry
```

Check the ClusterPullSecret status:

```bash
kubectl get clusterpullsecret my-encrypted-registry -o yaml
```

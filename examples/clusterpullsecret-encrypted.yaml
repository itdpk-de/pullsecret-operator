# Example: ClusterPullSecret with Encrypted Data

This example shows how to create a ClusterPullSecret with encrypted credentials stored directly in the resource.

## Create Docker Config JSON

First, create your Docker config JSON with credentials:

```bash
# Create the config JSON
cat > docker-config.json <<EOF
{
  "auths": {
    "ghcr.io": {
      "auth": "$(echo -n 'username:password' | base64)"
    }
  }
}
EOF
```

## Base64-encode

`encryptedData` expects **base64-encoded `.dockerconfigjson`**. The operator only
base64-decodes the value — it does **not** decrypt it:

```bash
cat docker-config.json | base64 -w 0 > docker-config-encoded.txt
```

> **Important — this is NOT encryption.** `encryptedData` provides no confidentiality:
> anyone with `get clusterpullsecrets` can decode it back to plaintext credentials.
> Do **not** put encrypted/ciphertext here — the operator would write the ciphertext as
> the `.dockerconfigjson` value and the resulting Secret would be invalid/unusable.
>
> For real encryption-at-rest, keep the credentials in a Kubernetes Secret and reference
> it via `secretRef` or `registryCredentials`, protecting that Secret with
> [SOPS](https://github.com/getsops/sops), [Sealed Secrets](https://github.com/bitnami-labs/sealed-secrets),
> or a secrets manager. See
> [clusterpullsecret-registrycredentials.yaml](clusterpullsecret-registrycredentials.yaml).

## Create ClusterPullSecret

Apply this ClusterPullSecret resource:

```yaml
apiVersion: pullsecret.itdpk.de/v1
kind: ClusterPullSecret
metadata:
  name: my-encrypted-registry
spec:
  credentials:
    encryptedData: |
      ewogICJhdXRocyI6IHsKICAgICJnaGNyLmlvIjogewogICAgICAiYXV0aCI6ICJkWE5s
      Y201aGJXVTZjR0Z6YzNkdmNtUT0iCiAgICB9CiAgfQp9Cg==
```

Save the above to a file (e.g., `clusterpullsecret-encrypted.yaml`) and apply:

```bash
kubectl apply -f clusterpullsecret-encrypted.yaml
```

## Use in Deployment

Annotate your Deployment to automatically get the pull secret:

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-secure-app
  annotations:
    pullsecret.itdpk.de/cluster-pull-secrets: "my-encrypted-registry"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-secure-app
  template:
    metadata:
      labels:
        app: my-secure-app
    spec:
      containers:
      - name: my-secure-app
        image: ghcr.io/myorg/my-private-image:latest
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: pullsecret-my-encrypted-registry
```

## Security Best Practices

`encryptedData` is base64-only and offers no confidentiality. For sensitive
credentials prefer `secretRef`/`registryCredentials` and:

1. **Never commit plaintext credentials** to version control
2. **Encrypt the referenced Secret at rest** with tools like:
   - [SOPS](https://github.com/getsops/sops) with AWS KMS, GCP KMS, Azure Key Vault, or PGP
   - [Sealed Secrets](https://github.com/bitnami-labs/sealed-secrets)
   - HashiCorp Vault
3. **Rotate credentials regularly** (the operator propagates source-secret changes)
4. **Use RBAC** to restrict who can view/modify ClusterPullSecret resources and Secrets

## Verify

Check that the secret was created:

```bash
kubectl get secrets -n <your-namespace> | grep pullsecret-my-encrypted-registry
```

Check the ClusterPullSecret status:

```bash
kubectl get clusterpullsecret my-encrypted-registry -o yaml
```

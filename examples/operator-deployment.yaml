apiVersion: v1
kind: Namespace
metadata:
  name: pullsecret-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pullsecret-operator
  namespace: pullsecret-operator-system
  labels:
    app: pullsecret-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pullsecret-operator
  template:
    metadata:
      labels:
        app: pullsecret-operator
    spec:
      serviceAccountName: pullsecret-operator
      containers:
      - name: operator
        image: pascalku/pullsecret-operator:latest
        imagePullPolicy: Always
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pullsecret-operator
  namespace: pullsecret-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pullsecret-operator
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["pullsecret.pascal-kutscha.de"]
  resources: ["clusterpullsecrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["pullsecret.pascal-kutscha.de"]
  resources: ["clusterpullsecrets/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pullsecret-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pullsecret-operator
subjects:
- kind: ServiceAccount
  name: pullsecret-operator
  namespace: pullsecret-operator-system

# Example: ClusterPullSecret with Secret Reference

This example shows how to create a ClusterPullSecret that references an existing Kubernetes Secret.

## Prerequisites

First, create a Docker registry secret:

```bash
kubectl create secret docker-registry my-docker-credentials \
  --docker-server=ghcr.io \
  --docker-username=myusername \
  --docker-password=mypassword \
  --docker-email=myemail@example.com \
  --namespace=default
```

## Create ClusterPullSecret

Apply this ClusterPullSecret resource:

```yaml
apiVersion: pullsecret.pascal-kutscha.de/v1
kind: ClusterPullSecret
metadata:
  name: my-registry
spec:
  credentials:
    secretRef:
      namespace: default
      name: my-docker-credentials
      key: .dockerconfigjson
```

Save the above to a file (e.g., `clusterpullsecret-secretref.yaml`) and apply:

```bash
kubectl apply -f clusterpullsecret-secretref.yaml
```

## Use in Deployment

Annotate your Deployment to automatically get the pull secret:

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  annotations:
    pullsecret.pascal-kutscha.de/cluster-pull-secrets: "my-registry"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: ghcr.io/myorg/my-private-image:latest
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: pullsecret-my-registry
```

The operator will automatically create a secret named `pullsecret-my-registry` in the same namespace as the Deployment.

## Verify

Check that the secret was created:

```bash
kubectl get secrets -n <your-namespace> | grep pullsecret-my-registry
```

Check the ClusterPullSecret status:

```bash
kubectl get clusterpullsecret my-registry -o yaml
```

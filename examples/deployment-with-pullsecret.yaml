apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-application
  namespace: production
  annotations:
    # Reference one or more ClusterPullSecrets (comma-separated)
    pullsecret.pascal-kutscha.de/cluster-pull-secrets: "my-docker-registry"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-application
  template:
    metadata:
      labels:
        app: my-application
    spec:
      # The operator creates secrets named "pullsecret-<clusterpullsecret-name>"
      imagePullSecrets:
      - name: pullsecret-my-docker-registry
      containers:
      - name: app
        image: registry.example.com/myorg/my-application:v1.0.0
        ports:
        - containerPort: 8080

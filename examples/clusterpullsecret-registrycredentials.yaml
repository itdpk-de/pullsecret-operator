# Example: ClusterPullSecret with Registry Credentials Reference

This example shows how to supply individual registry credential fields
(server, username, password, email) via a Kubernetes Secret. The operator
reads those fields and assembles the `.dockerconfigjson` format automatically,
so no credential data ever needs to be embedded directly in the
ClusterPullSecret spec.

## Security note

The actual credentials live exclusively in the Kubernetes Secret, which is
protected by Kubernetes RBAC. The ClusterPullSecret only holds a *reference*
to that Secret (namespace + name), so inspecting a ClusterPullSecret reveals
no sensitive data.

## Prerequisites

Create a Secret with the individual credential fields:

```bash
kubectl create secret generic my-registry-credentials \
  --from-literal=server=ghcr.io \
  --from-literal=username=myusername \
  --from-literal=password=mypassword \
  --from-literal=email=myemail@example.com \
  --namespace=default
```

Or using a YAML manifest:

```yaml
apiVersion: v1
kind: Secret
metadata:
  name: my-registry-credentials
  namespace: default
type: Opaque
stringData:
  server: ghcr.io
  username: myusername
  password: mypassword
  email: myemail@example.com
```

> **Note:** Never commit Secrets containing real credentials to version
> control. Use tools like [Sealed Secrets](https://github.com/bitnami-labs/sealed-secrets),
> [SOPS](https://github.com/mozilla/sops), or a secrets manager to protect
> them before storing them in a repository.

## Create ClusterPullSecret

Apply this ClusterPullSecret resource:

```yaml
apiVersion: pullsecret.pascal-kutscha.de/v1
kind: ClusterPullSecret
metadata:
  name: my-registry
spec:
  credentials:
    registryCredentials:
      secretName: my-registry-credentials
      namespace: default
      # The keys below are the defaults and can be omitted when your Secret
      # uses the same names.
      serverKey: server
      usernameKey: username
      passwordKey: password
      emailKey: email
```

Save the above to a file (e.g., `clusterpullsecret-registrycredentials.yaml`) and apply:

```bash
kubectl apply -f clusterpullsecret-registrycredentials.yaml
```

The operator will read the four fields from the Secret and build a valid
`.dockerconfigjson` (including the base64-encoded `auth` field) on your behalf.

### Custom key names

If your Secret uses different key names, specify them explicitly:

```yaml
spec:
  credentials:
    registryCredentials:
      secretName: my-registry-credentials
      namespace: default
      serverKey: registry_host
      usernameKey: registry_user
      passwordKey: registry_pass
      emailKey: registry_email
```

### Email is optional

The `email` field (and therefore `emailKey`) is optional. If the key is absent
from the Secret, the resulting `.dockerconfigjson` will simply omit the email
entry, which is accepted by all major container registries.

## Use in Deployment

Annotate your Deployment to automatically get the pull secret:

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  annotations:
    pullsecret.pascal-kutscha.de/cluster-pull-secrets: "my-registry"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: ghcr.io/myorg/my-private-image:latest
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: pullsecret-my-registry
```

The operator will automatically create a secret named `pullsecret-my-registry`
in the same namespace as the Deployment.

## Verify

Check that the secret was created:

```bash
kubectl get secrets -n <your-namespace> | grep pullsecret-my-registry
```

Check the ClusterPullSecret status:

```bash
kubectl get clusterpullsecret my-registry -o yaml
```
